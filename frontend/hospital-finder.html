
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nearby Hospital Finder</title>

    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        #map {
            height: 450px;
            width: 100%;
            border-radius: 10px;
        }

        #results {
            margin-top: 20px;
        }

        .hospital {
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h2>Nearby Hospital Finder</h2>

    <p>Click anywhere on the map to select an accident location.</p>

    <div id="map"></div>

    <p id="status">Select a location on the map.</p>

    <div id="results"></div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. Initialize map (Hyderabad default view)
        const map = L.map('map').setView(
            [17.3850, 78.4867], 12
        );

        // 2. Load OpenStreetMap tiles
        L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                attribution: '&copy; OpenStreetMap contributors'
            }
        ).addTo(map);

        let accidentMarker = null;
        let hospitalMarkers = [];

        // 3. Calculate distance using Haversine formula
        function calculateDistance(lat1, lon1, lat2, lon2) {

            const R = 6371;

            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;

            const a =
                Math.sin(dLat / 2) ** 2 +
                Math.cos(lat1 * Math.PI / 180) *
                Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) ** 2;

            const c = 2 * Math.atan2(
                Math.sqrt(a),
                Math.sqrt(1 - a)
            );

            return R * c;
        }

        // 4. Search hospitals using Overpass API
        async function findHospitals(lat, lon) {

            const status = document.getElementById('status');
            const results = document.getElementById('results');

            status.textContent = 'Searching nearby hospitals...';
            results.innerHTML = '';

            const radius = 5000;

            const query = `
                [out:json][timeout:25];
                (
                    nwr["amenity"="hospital"]
                    (around:${radius},${lat},${lon});

                    nwr["healthcare"="hospital"]
                    (around:${radius},${lat},${lon});
                );
                out center tags;
            `;

            try {

                const response = await fetch(
                    'https://overpass-api.de/api/interpreter',
                    {
                        method: 'POST',
                        body: new URLSearchParams({
                            data: query
                        })
                    }
                );

                if (!response.ok) {
                    throw new Error('Hospital search failed');
                }

                const data = await response.json();

                // Remove previous hospital markers
                hospitalMarkers.forEach(marker => {
                    map.removeLayer(marker);
                });

                hospitalMarkers = [];

                // 5. Process hospital data
                const hospitals = data.elements.map(hospital => {

                    const hospitalLat =
                        hospital.lat ?? hospital.center?.lat;

                    const hospitalLon =
                        hospital.lon ?? hospital.center?.lon;

                    if (hospitalLat == null || hospitalLon == null) {
                        return null;
                    }

                    return {
                        name: hospital.tags?.name || 'Unnamed Hospital',
                        lat: hospitalLat,
                        lon: hospitalLon,
                        phone: hospital.tags?.phone ||
                               hospital.tags?.['contact:phone'] ||
                               'Not available',
                        distance: calculateDistance(
                            lat, lon, hospitalLat, hospitalLon
                        )
                    };

                }).filter(Boolean);

                // Remove duplicate locations
                const uniqueHospitals = [
                    ...new Map(
                        hospitals.map(h => [
                            `${h.lat},${h.lon}`, h
                        ])
                    ).values()
                ];

                // 6. Sort by distance
                uniqueHospitals.sort(
                    (a, b) => a.distance - b.distance
                );

                // 7. Display hospital markers
                uniqueHospitals.forEach(hospital => {

                    const marker = L.marker([
                        hospital.lat,
                        hospital.lon
                    ]).addTo(map);

                    marker.bindPopup(
                        `<b>${escapeHTML(hospital.name)}</b><br>
                         Distance: ${hospital.distance.toFixed(2)} km`
                    );

                    hospitalMarkers.push(marker);

                });

                // 8. Display hospital details
                if (uniqueHospitals.length === 0) {

                    status.textContent =
                        'No hospitals found within 5 km.';

                    return;
                }

                status.textContent =
                    `${uniqueHospitals.length} hospitals found within 5 km.`;

                uniqueHospitals.slice(0, 10).forEach(hospital => {

                    const card = document.createElement('div');
                    card.className = 'hospital';

                    const name = document.createElement('h3');
                    name.textContent = hospital.name;

                    const distance = document.createElement('p');
                    distance.textContent =
                        `Distance: ${hospital.distance.toFixed(2)} km`;

                    const phone = document.createElement('p');
                    phone.textContent = `Phone: ${hospital.phone}`;

                    const link = document.createElement('a');
                    link.href =
                        `https://www.google.com/maps/dir/?api=1&destination=${hospital.lat},${hospital.lon}`;
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';
                    link.textContent = 'Get Directions';

                    card.append(name, distance, phone, link);
                    results.appendChild(card);
                });

            } catch (error) {

                console.error(error);

                status.textContent =
                    'Unable to retrieve hospitals. Please try again later.';
            }
        }

        // Escape text used inside map popup HTML
        function escapeHTML(value) {
            return String(value).replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[char]);
        }

        // 9. Detect map click
        map.on('click', function(event) {

            const lat = event.latlng.lat;
            const lon = event.latlng.lng;

            // Remove previous accident marker
            if (accidentMarker) {
                map.removeLayer(accidentMarker);
            }

            // Mark selected accident location
            accidentMarker = L.marker([lat, lon])
                .addTo(map)
                .bindPopup('Selected Accident Location')
                .openPopup();

            console.log('Latitude:', lat);
            console.log('Longitude:', lon);

            // Search nearby hospitals
            findHospitals(lat, lon);

        });

    </script>

</body>
</html>
